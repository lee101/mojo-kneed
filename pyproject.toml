[project]
name = "mojo-kneed"
version = "0.1.0"
description = "Kneedle knee-point detection with Mojo kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "kneed", "kneedle", "knee-detection"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "kneed==0.8.6"]
plot = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-kneed"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
